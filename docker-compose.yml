# First-party services run prebuilt images tagged with ${TAG:-latest}.
# DB 마다 exporter 를 하나씩 띄운다. 이미지와 공통 설정만 여기 모은다.
# 계정은 scripts/create-pg-exporter-role.sh 로 먼저 만들어야 한다.
x-postgres-exporter: &postgres-exporter
  image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
  networks:
    - sandol_network
  restart: always
  logging:
    driver: "local"
    options:
      max-size: "10m"
      max-file: "7"

services:
  gateway:
    container_name: sandol-gateway
    image: sandol-gateway:${TAG:-latest}
    ports:
      - "8010:80"
    environment:
      SECRET_KEY: ${SECRET_KEY}
      GATEWAY_TRUSTED_PROXIES:  # 값 없이 이름만: .env 값 전달, 미설정이면 스크립트 기본값
      # Keycloak·auth-relay 업스트림(host:port). 인증 스택을 다른 서버로 옮기면 .env에서 그 주소로 바꾼다.
      KEYCLOAK_UPSTREAM: ${KEYCLOAK_UPSTREAM:-keycloak-edge:8080}
      AUTH_RELAY_UPSTREAM: ${AUTH_RELAY_UPSTREAM:-auth-relay:8000}
    depends_on:
      meal-service:
        condition: service_healthy
      meal-web:
        condition: service_healthy
      kakao-bot-service:
        condition: service_healthy
      static-info-service:
        condition: service_healthy
      classroom-timetable-service:
        condition: service_healthy
      notice-notification:
        condition: service_healthy
      studyroom-service:
        condition: service_healthy
    volumes:
      - ./sandol-gateway/gateway:/etc/nginx/conf.d
    command: ["/bin/sh", "/etc/nginx/conf.d/render-trusted-proxies.sh", "/usr/local/openresty/bin/openresty", "-g", "env SECRET_KEY; env KEYCLOAK_UPSTREAM; env AUTH_RELAY_UPSTREAM; daemon off;"]
    networks:
      - sandol_network
      - keycloak_edge
    restart: always
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "7"

  meal-service:
    container_name: sandol_meal_service
    image: sandol-sandol_meal_service:${TAG:-latest}
    env_file:
      - ./sandol_meal_service/.env
    environment:
      # Keycloak 내부 호출 주소(끝 슬래시 필수). env_file의 KC_LOCAL_URL보다 우선한다
      KC_LOCAL_URL: ${KC_INTERNAL_URL:-http://keycloak:8080/auth}/
      PYTHONUNBUFFERED: "1"
      SECRET_KEY: ${SECRET_KEY}
      MEAL_TYPES_FILE_NAME: ${MEAL_TYPES_FILE_NAME:-meal_types.json}
      MEAL_UPLOAD_ARCHIVE_DIR: /app/data/uploads
      MEAL_EXCEL_AUTO_SYNC_ENABLED: "false"
    volumes:
      - ${SANDOL_DATA_DIR:-/home/ubuntu/data/sandol}/meal/student_cafeteria.json:/app/app/config/student_cafeteria.json:ro
      - ${SANDOL_DATA_DIR:-/home/ubuntu/data/sandol}/meal/meal_types.json:/app/app/config/meal_types.json:ro
      - ${SANDOL_DATA_DIR:-/home/ubuntu/data/sandol}/meal/uploads:/app/data/uploads
      # 크롤러가 내려받은 엑셀 아카이브(컨테이너 재생성 시 유실 방지)
      - ${SANDOL_DATA_DIR:-/home/ubuntu/data/sandol}/meal/archive:/app/tmp/archive
    networks:
      - sandol_network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/meal/health || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "7"
    depends_on:
      db-backup:
        condition: service_completed_successfully
      meal-service-db:
        condition: service_healthy

  meal-web:
    container_name: sandol_meal_web
    image: sandol-sandol_meal_web:${TAG:-latest}
    env_file:
      - path: ./sandol_meal_web/.env
        required: false
    environment:
      PYTHONUNBUFFERED: "1"
      MEAL_SERVICE_BASE_URL: http://meal-service:80
      MEAL_WEB_PUBLIC_BASE_URL: https://${SERVICE_DOMAIN:-sandori.kr}/meal-web
      MEAL_WEB_COOKIE_SECURE: "true"
    networks:
      - sandol_network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: on-failure
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "7"
    depends_on:
      meal-service:
        condition: service_healthy

  meal-service-db:
    container_name: meal-service-db
    image: postgres:15
    restart: always
    env_file:
      - ./sandol_meal_service/.env
    volumes:
      - meal_service_db_data:/var/lib/postgresql/data
    networks:
      - sandol_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d meal_service -U postgres"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "7"

  kakao-bot-service:
    depends_on:
      db-backup:
        condition: service_completed_successfully
    container_name: sandol_kakao_bot_service
    image: sandol-sandol_kakao_bot_service:${TAG:-latest}
    env_file:
      - ./sandol_kakao_bot_service/.env
    environment:
      PYTHONUNBUFFERED: "1"
      SECRET_KEY: ${SECRET_KEY}
      TOKEN_ENCRYPTION_KEY: ${KAKAO_TOKEN_ENCRYPTION_KEY}
    volumes:
      - ${SANDOL_DATA_DIR:-/home/ubuntu/data/sandol}/kakao-bot/kakao_bot_service.db:/app/kakao_bot_service.db
    networks:
      - sandol_network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/kakao-bot/health || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "7"

  static-info-service:
    container_name: sandol_static_info_service
    image: sandol-sandol-static-info-service:${TAG:-latest}
    # KC_CLIENT_ID·KC_CLIENT_SECRET은 이 파일에 둔다. environment 값이 env_file보다 우선한다
    env_file:
      - path: ./sandol-static-info-service/.env
        required: false
    environment:
      PYTHONUNBUFFERED: "1"
      SECRET_KEY: ${SECRET_KEY}
      # 공휴일 API(한국천문연구원 특일 정보) 서비스키. 비어 있으면 정적 공휴일 파일만 사용
      HOLIDAY_API_KEY: ${HOLIDAY_API_KEY:-}
      # Keycloak 공개 주소(토큰 issuer 검증용)와 컨테이너→keycloak 직결 내부 주소(JWKS·토큰 교환용)
      KC_SERVER_URL: https://${SERVICE_DOMAIN:-sandori.kr}/auth/
      KC_JWKS_URL: ${KC_INTERNAL_URL:-http://keycloak:8080/auth}/realms/Sandori/protocol/openid-connect/certs
      KC_TOKEN_URL: ${KC_INTERNAL_URL:-http://keycloak:8080/auth}/realms/Sandori/protocol/openid-connect/token
      PUBLIC_BASE_URL: https://${SERVICE_DOMAIN:-sandori.kr}
      STATIC_INFO_PUBLIC_BASE_URL: https://${SERVICE_DOMAIN:-sandori.kr}/static-info
      # 관리자 화면 활성화. 세션 키가 비어 있으면 fail-closed로 관리자 화면이 마운트되지 않음
      ADMIN_PANEL_ENABLED: "True"
      ADMIN_SESSION_KEY: ${STATIC_INFO_ADMIN_SESSION_KEY:-}
      # 비면 azp/aud 검사 안 함. 값을 넣으면 static-info 관리자 클라이언트 ID를 반드시 포함해야 함(빠지면 관리자 로그인 401)
      KC_ALLOWED_CLIENTS: ${STATIC_INFO_KC_ALLOWED_CLIENTS:-}
    volumes:
      - ${SANDOL_DATA_DIR:-/home/ubuntu/data/sandol}/static-info/school_info.json:/app/app/config/school_info.json:ro
      # 셔틀 시간표 JSON 등 런타임 생성 데이터 (DATA_DIR 기본값 /app/data)
      - ${SANDOL_DATA_DIR:-/home/ubuntu/data/sandol}/static-info/data:/app/data
    networks:
      - sandol_network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/static-info/health || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "7"

  classroom-timetable-service:
    container_name: sandol_classroom_timetable_service
    image: sandol-sandol_classroom_timetable_service:${TAG:-latest}
    volumes:
      # 시간표 데이터는 서브모듈에서 git 관리. git pull + submodule update 후 재생성하면 반영됨 (이미지 재빌드 불필요)
      - ./sandol_classroom_timetable_service/data:/app/data:ro
    networks:
      - sandol_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --tries=1 http://localhost:80/classroom-timetable/health || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "7"

  notice-notification:
    container_name: sandol-notice-notification
    image: sandol-sandol_notice_notification:${TAG:-latest}
    restart: always
    init: true
    cpus: "3.0"
    mem_limit: 1536m
    env_file:
      - ./sandol_notice_notification/.env
    networks:
      - sandol_network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/notice-notification/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      db-backup:
        condition: service_completed_successfully
      amqp:
        condition: service_healthy
      notice-notification-db:
        condition: service_healthy
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "7"

  notice-notification-db:
    container_name: sandol-notice-notification-db
    image: postgres:15
    restart: always
    env_file:
      - ./sandol_notice_notification/.env
    volumes:
      - notice_notification_db_data:/var/lib/postgresql/data
    networks:
      - sandol_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d postgres -U root"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "7"

  amqp:
    container_name: amqp
    image: rabbitmq:3-management
    restart: always
    expose:
      - "15692"
    volumes:
      - ./config/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks:
      - sandol_network
    # TASK-195: rabbitmq-diagnostics는 호출마다 Erlang VM을 새로 띄워(유휴 약 2초, 부하 시 5초 초과) timeout이 반복되면
    # 50초 만에 unhealthy가 되고 compose up이 "dependency failed to start"로 중단됐다.
    # VM을 띄우지 않는 TCP 점검으로 대체한다: 5672(AMQP)와 15692(prometheus 플러그인 listener)가 열려 있는지만 본다.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5672 && exec 4<>/dev/tcp/127.0.0.1/15692"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
      start_interval: 3s
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "7"

  loki:
    image: grafana/loki:latest
    container_name: loki
    mem_limit: 384m
    volumes:
      - ./sandol-log-manager/config/loki/loki-config.yaml:/etc/loki/local-config.yaml
      - ${SANDOL_DATA_DIR:-/home/ubuntu/data/sandol}/log-manager/loki:/var/lib/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - sandol_network
    restart: always
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "7"

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.3.0}
    container_name: prometheus
    mem_limit: 384m
    volumes:
      - ./config/monitoring/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=2GB"
    networks:
      - sandol_network
    restart: always
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "7"

  postgres-exporter-meal:
    <<: *postgres-exporter
    container_name: postgres-exporter-meal
    environment:
      DATA_SOURCE_NAME: "postgresql://sandol_exporter:${PG_EXPORTER_PASSWORD}@meal-service-db:5432/meal_service?sslmode=disable"
    depends_on:
      - meal-service-db

  postgres-exporter-notice:
    <<: *postgres-exporter
    container_name: postgres-exporter-notice
    environment:
      DATA_SOURCE_NAME: "postgresql://sandol_exporter:${PG_EXPORTER_PASSWORD}@sandol-notice-notification-db:5432/notice?sslmode=disable"
    depends_on:
      - notice-notification-db

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    mem_limit: 512m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./sandol-log-manager/config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /sys:/sys:ro
      - /proc:/rootfs/proc:ro
      - /var/lib/docker:/rootfs/var/lib/docker:ro
    command: run --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    depends_on:
      - loki
    networks:
      - sandol_network
    restart: always
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "7"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    mem_limit: 640m
    volumes:
      - grafana_data:/var/lib/grafana
      - ./sandol-log-manager/config/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - sandol_network
    restart: always
    environment:
      GF_LOG_LEVEL: "warn"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "7"

  # 마이그레이션 전 DB 스냅샷. one-shot으로 매 up마다 재실행되며, 실패하면
  # 마이그레이션을 돌리는 서비스들이 기동되지 않는다(fail-closed).
  # 이미지는 pull 없이 재사용하려고 meal-service-db와 같은 계열의 postgres:16-alpine을 쓴다.
  # pg_dump 16은 postgres 15 서버도 덤프한다.
  db-backup:
    container_name: sandol-db-backup
    image: postgres:16-alpine
    restart: "no"
    entrypoint: ["sh", "/db-backup.sh"]
    environment:
      BACKUP_KEEP: ${BACKUP_KEEP:-10}
    volumes:
      - ./scripts/db-backup.sh:/db-backup.sh:ro
      - ./sandol_meal_service/.env:/env/meal.env:ro
      - ./sandol_notice_notification/.env:/env/notice.env:ro
      - ${SANDOL_DATA_DIR:-/home/ubuntu/data/sandol}/kakao-bot/kakao_bot_service.db:/sqlite/kakao_bot_service.db:ro
      - ${SANDOL_BACKUP_DIR:-${SANDOL_DATA_DIR:-/home/ubuntu/data/sandol}/backups}:/backup
    networks:
      - sandol_network
    depends_on:
      meal-service-db:
        condition: service_healthy
      notice-notification-db:
        condition: service_healthy
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "7"

  studyroom-service:
    container_name: sandol_studyroom_service
    image: sandol-sandol_studyroom_service:${TAG:-latest}
    env_file:
      - ./sandol_studyroom_service/.env
    networks:
      - sandol_network
    healthcheck:
      # 이미지에 curl 이 없어 python 으로 확인한다.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/studyroom/health', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "7"
    depends_on:
      studyroom-db:
        condition: service_healthy
      studyroom-redis:
        condition: service_healthy

  studyroom-db:
    container_name: studyroom-db
    image: postgres:15
    restart: always
    env_file:
      - ./sandol_studyroom_service/.env
    environment:
      TZ: Asia/Seoul
    volumes:
      - studyroom_db_data:/var/lib/postgresql/data
    networks:
      - sandol_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "7"

  studyroom-redis:
    container_name: studyroom-redis
    image: redis:7.4-alpine
    # 현황 cache 만 담으므로 디스크에 남기지 않는다.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: always
    networks:
      - sandol_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "7"

volumes:
  grafana_data: {}
  alloy_data: {}
  prometheus_data: {}
  meal_service_db_data: {}
  notice_notification_db_data: {}
  studyroom_db_data: {}

networks:
  sandol_network:
    driver: bridge
  keycloak_edge:
    name: sandol_keycloak_edge
    driver: bridge
    ipam:
      config:
        - subnet: ${KEYCLOAK_EDGE_SUBNET:-172.31.255.248/29}

global:
  scrape_interval: 15s

scrape_configs:
  # 브로커 전체 지표. alarms 와 channel 계열은 이 경로에만 있다.
  - job_name: "rabbitmq"
    static_configs:
      - targets: ["amqp:15692"]

  # 큐별 지표. rabbitmq_detailed_ 접두사가 붙어서 위 job 과 이름이 겹치지 않는다.
  - job_name: "rabbitmq-queues"
    metrics_path: /metrics/detailed
    params:
      family:
        - queue_coarse_metrics
        - queue_metrics
    static_configs:
      - targets: ["amqp:15692"]

  # exporter 가 DB 마다 하나씩 있다. db 라벨로 구분한다.
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter-meal:9187"]
        labels:
          db: "meal_service"
      # keycloak exporter는 sandol-auth 프로젝트에서 뜬다. 같은 서버에서는 colocated 오버라이드로 sandol_network에 붙어 이름이 풀린다.
      # Keycloak을 다른 서버로 옮기면 이 target을 그 서버 주소로 바꾼다.
      - targets: ["postgres-exporter-keycloak:9187"]
        labels:
          db: "keycloak"
      - targets: ["postgres-exporter-notice:9187"]
        labels:
          db: "notice"
